name: CI checks

# Disabled 2026-10-07: jobs never get a runner (account/repo Actions setting),
# so every run failed without testing anything. Run `npm test` locally instead.
# To re-enable, restore the push / pull_request triggers below.
on:
  workflow_dispatch:
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Run CI check suite
        run: npm test
