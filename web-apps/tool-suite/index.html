<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Engineering Tool Suite Hub</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #111827;
      --card-hover: #1f293d;
      --border: #1e293b;
      --border-focus: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --success: #34d399;
      --tag-bg: rgba(56, 189, 248, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px; min-height: 100vh; display: flex; flex-direction: column; gap: 24px; max-width: 1280px; margin: 0 auto; }

    header { display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
    header h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; }
    header p { color: var(--muted); font-size: 0.95rem; }

    .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    .search-box { flex: 1; min-width: 280px; }
    input { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 12px 16px; border-radius: 8px; font-size: 0.9rem; outline: none; width: 100%; transition: border-color 0.2s; }
    input:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px var(--accent-glow); }
    
    .filter-tags { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .filter-btn { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
    .filter-btn.active, .filter-btn:hover { background: var(--accent); color: #000; font-weight: 600; border-color: var(--accent); }

    .tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }

    .tool-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; text-decoration: none; color: inherit; transition: all 0.2s ease; }
    .tool-card:hover { background: var(--card-hover); border-color: var(--border-focus); transform: translateY(-3px); box-shadow: 0 12px 24px rgba(0,0,0,0.4); }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .card-title { font-size: 1.1rem; font-weight: 600; color: var(--text); line-height: 1.3; }
    
    .status-badge { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; font-family: monospace; letter-spacing: 0.05em; }
    .status-badge.live { background: rgba(52, 211, 153, 0.15); color: var(--success); border: 1px solid rgba(52, 211, 153, 0.3); }

    .card-desc { font-size: 0.88rem; color: var(--muted); line-height: 1.5; flex: 1; }

    .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 12px; font-size: 0.75rem; color: var(--muted); }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { background: var(--tag-bg); color: var(--accent); padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-family: monospace; }

    .empty-state { text-align: center; color: var(--muted); padding: 60px; grid-column: 1 / -1; display: none; }
  </style>
</head>
<body>

  <header>
    <h1>AI Systems Engineering Suite</h1>
    <p>18 high-agency single-file web applications for context engineering, loop harnesses, and evals.</p>
  </header>

  <div class="controls">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search 18 tools by name, description, or tag..." />
    </div>
    <div class="filter-tags" id="tagFilters">
      <button class="filter-btn active" onclick="filterByTag('all', this)">All Tools</button>
      <button class="filter-btn" onclick="filterByTag('context-engineering', this)">Context</button>
      <button class="filter-btn" onclick="filterByTag('harnesses', this)">Harnesses</button>
      <button class="filter-btn" onclick="filterByTag('loops', this)">Loops</button>
      <button class="filter-btn" onclick="filterByTag('evaluations', this)">Evaluations</button>
    </div>
  </div>

  <div class="tool-grid" id="toolGrid"></div>
  <div class="empty-state" id="emptyState">No tools matching your query.</div>

  <script>
    const TOOLS = [
      { id: "context-compactor", name: "Context Budgeting & Compactor", path: "context-compactor/index.html", description: "Real-time token estimation, sliding-window compaction, and lossy/lossless state pruning.", tags: ["context-engineering", "tokens"], status: "live", dateAdded: "2026-07-31" },
      { id: "react-loop-visualizer", name: "ReAct Loop Visualizer", path: "react-loop-visualizer/index.html", description: "Trace tree inspector for intermediate agent Thought -> Action -> Observation steps with step-pause controls.", tags: ["harnesses", "loops"], status: "live", dateAdded: "2026-07-31" },
      { id: "mcp-schema-converter", name: "MCP Client Inspector", path: "mcp-schema-converter/index.html", description: "Inspects and compiles tool definitions into OpenAI/Gemini JSON schemas for context injection.", tags: ["context-engineering", "mcp"], status: "live", dateAdded: "2026-07-31" },
      { id: "schema-repair-engine", name: "JSON Schema Repair Loop", path: "schema-repair-engine/index.html", description: "Validates outputs against JSON Schemas and runs targeted auto-repair iteration loops.", tags: ["harnesses", "validation"], status: "live", dateAdded: "2026-07-31" },
      { id: "multi-llm-arena", name: "Multi-LLM Arena & Parallel Tester", path: "multi-llm-arena/index.html", description: "Parallel prompt execution across Gemini and Groq with diff, TTFT, and token velocity metrics.", tags: ["evaluations", "benchmarking"], status: "live", dateAdded: "2026-07-31" },
      { id: "llm-rubric-judge", name: "LLM-as-a-Judge Rubric Evaluator", path: "llm-rubric-judge/index.html", description: "Automated multi-criteria grading with explicit chain-of-thought rationale scoring.", tags: ["evaluations", "rubrics"], status: "live", dateAdded: "2026-07-31" },
      { id: "context-firewall", name: "Context Firewall & Hand-off Generator", path: "context-firewall/index.html", description: "Strips trace noise from agent chats and builds compact state hand-off payloads.", tags: ["context-engineering", "state"], status: "live", dateAdded: "2026-07-31" },
      { id: "needle-haystack-benchmarker", name: "Needle in a Haystack Benchmarker", path: "needle-haystack-benchmarker/index.html", description: "Simulates semantic retrieval accuracy across 0%–100% context depth distributions.", tags: ["context-engineering", "evaluations"], status: "live", dateAdded: "2026-07-31" },
      { id: "prompt-mutation-optimizer", name: "System Prompt Mutation Optimizer", path: "prompt-mutation-optimizer/index.html", description: "Iteratively mutates system prompts and scores variations against target constraints.", tags: ["context-engineering", "prompts"], status: "live", dateAdded: "2026-07-31" },
      { id: "hitl-gatekeeper", name: "Agentic HITL Gatekeeper", path: "hitl-gatekeeper/index.html", description: "Human-in-the-loop review interface for agentic tool execution payload approval.", tags: ["harnesses", "hitl"], status: "live", dateAdded: "2026-07-31" },
      { id: "golden-dataset-harness", name: "Golden Dataset Test Harness", path: "golden-dataset-harness/index.html", description: "Batch test runner for JSON/CSV datasets to prevent prompt regression.", tags: ["evaluations", "testing"], status: "live", dateAdded: "2026-07-31" },
      { id: "adversarial-red-teamer", name: "Adversarial Edge-Case Red-Teamer", path: "adversarial-red-teamer/index.html", description: "Generates prompt injection, jailbreak, and malformed payload vectors against system prompts.", tags: ["evaluations", "security"], status: "live", dateAdded: "2026-07-31" },
      { id: "fewshot-example-builder", name: "Few-Shot Canonical Example Builder", path: "fewshot-example-builder/index.html", description: "Formats, tokenizes, and optimizes few-shot exemplar arrays for system prompts.", tags: ["context-engineering", "prompts"], status: "live", dateAdded: "2026-07-31" },
      { id: "latency-cost-profiler", name: "Model Latency & Cost Profiler", path: "latency-cost-profiler/index.html", description: "Calculates total cost per million tokens, generation velocity, and TTFT across providers.", tags: ["evaluations", "metrics"], status: "live", dateAdded: "2026-07-31" },
      { id: "compression-ratio-benchmarker", name: "Context Compression Benchmarker", path: "compression-ratio-benchmarker/index.html", description: "Compares semantic retention versus compression ratios across context reduction algorithms.", tags: ["context-engineering", "benchmarking"], status: "live", dateAdded: "2026-07-31" },
      { id: "gan-contract-evaluator", name: "Multi-Agent GAN Contract Evaluator", path: "gan-contract-evaluator/index.html", description: "Generator-Critique double-loop evaluator enforcing strict schema and logic contracts.", tags: ["harnesses", "evaluations"], status: "live", dateAdded: "2026-07-31" },
      { id: "worker-backoff-gateway", name: "Edge Exponential Backoff Gateway", path: "worker-backoff-gateway/index.html", description: "Simulates jittered exponential backoff and rate-limit handling for Cloudflare Worker proxies.", tags: ["harnesses", "infrastructure"], status: "live", dateAdded: "2026-07-31" },
      { id: "scratchpad-state-manager", name: "Scratchpad State Manager", path: "scratchpad-state-manager/index.html", description: "Isolates execution memory state across multi-turn agent execution loops.", tags: ["context-engineering", "loops"], status: "live", dateAdded: "2026-07-31" }
    ];

    let currentTag = 'all';

    function renderTools(tools) {
      const grid = document.getElementById('toolGrid');
      const emptyState = document.getElementById('emptyState');
      grid.innerHTML = '';

      if (tools.length === 0) {
        emptyState.style.display = 'block';
        return;
      }
      emptyState.style.display = 'none';

      tools.forEach(tool => {
        const card = document.createElement('a');
        card.className = 'tool-card';
        card.href = `../${tool.path}`;

        card.innerHTML = `
          <div>
            <div class="card-header">
              <div class="card-title">${tool.name}</div>
              <span class="status-badge ${tool.status}">${tool.status}</span>
            </div>
            <p class="card-desc" style="margin-top: 10px;">${tool.description}</p>
          </div>
          <div class="card-footer">
            <div class="tags">
              ${tool.tags.map(t => `<span class="tag">#${t}</span>`).join('')}
            </div>
            <span>${tool.dateAdded}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterTools() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = TOOLS.filter(tool => {
        const matchesQuery = tool.name.toLowerCase().includes(query) ||
                             tool.description.toLowerCase().includes(query) ||
                             tool.tags.some(t => t.toLowerCase().includes(query));
        const matchesTag = currentTag === 'all' || tool.tags.includes(currentTag);
        return matchesQuery && matchesTag;
      });
      renderTools(filtered);
    }

    function filterByTag(tag, btnElement) {
      currentTag = tag;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
      filterTools();
    }

    document.getElementById('searchInput').addEventListener('input', filterTools);
    renderTools(TOOLS);
  </script>
</body>
</html>
