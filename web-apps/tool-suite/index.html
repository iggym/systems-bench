<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Engineering Tool Suite</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--ok:#3fb950;--warn:#d29922;--err:#f85149;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;padding:24px;max-width:1200px;margin:0 auto}
h1{font-size:1.5rem;margin-bottom:4px}
p.sub{color:var(--muted);font-size:.85rem;margin-bottom:16px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
input,select{background:#010409;border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;font-size:.82rem}
input{flex:1;min-width:200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card h3{font-size:.95rem;color:var(--accent)}
.card p{color:var(--muted);font-size:.76rem;line-height:1.4;flex:1}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:.6rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border:1px solid var(--border);padding:1px 6px;border-radius:8px}
.mode{font-size:.62rem;font-weight:700;text-transform:uppercase;padding:2px 8px;border-radius:10px;align-self:flex-start}
.m-local{background:rgba(210,153,34,.12);color:var(--warn);border:1px solid rgba(210,153,34,.35)}
.m-hybrid{background:rgba(88,166,255,.12);color:var(--accent);border:1px solid rgba(88,166,255,.35)}
.m-api{background:rgba(63,185,80,.12);color:var(--ok);border:1px solid rgba(63,185,80,.35)}
.chips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chip{font-size:.72rem;color:var(--muted);border:1px solid var(--border);padding:3px 10px;border-radius:12px}
.hint{font-size:.75rem;color:var(--muted)}
</style>
</head>
<body>
<h1>AI Engineering Tool Suite</h1>
<p class="sub">Registry of all 26 systems-bench tools — single-purpose, client-side, zero accounts. Key-hybrid tools work locally and unlock live model features when you paste an API key in the tool itself.</p>

<div class="controls">
  <input id="q" placeholder="Search tools, tags, descriptions…" oninput="render()">
  <select id="tagSel" onchange="render()"><option value="">All tags</option></select>
  <select id="modeSel" onchange="render()"><option value="">All modes</option><option value="local">local-only</option><option value="hybrid">key-hybrid</option><option value="api">live API</option></select>
</div>
<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>
<p class="hint" id="count"></p>

<script>
const TOOLS = [
  { id:"meter-shock", name:"Meter Shock", desc:"Projects usage-based spend to month-end from today's burn rate and tells you the exact day you cross your budget.", tags:["diagnostic","billing","cost"], mode:"local", url:"../meter-shock/index.html" },
  { id:"pipeline-rot", name:"Pipeline Rot", desc:"Scores a data/ML pipeline against real decay patterns — drift, step changes, volatility, staleness, silent-failure risk.", tags:["diagnostic","mlops"], mode:"local", url:"../pipeline-rot/index.html" },
  { id:"zombie-stack", name:"Zombie Stack", desc:"Flags subscriptions and services still running long after the workload that justified them is gone, and totals the wasted spend.", tags:["diagnostic","cost"], mode:"local", url:"../zombie-stack/index.html" },
  { id:"ai-infra-router", name:"AI Infra Router & SOW Generator", desc:"Deterministic routing decision (managed API vs self-hosted vs hybrid), GPU-vs-API cost estimate, PII scrubber, and SOW text.", tags:["mlops","architecture","calculator"], mode:"local", url:"../ai-infra-router/index.html" },
  { id:"jeff-dean", name:"Jeff Dean Latency & Capacity Profiler", desc:"Back-of-the-envelope capacity math: bandwidth, base latency, compression savings, and bottleneck diagnosis.", tags:["diagnostic","capacity-planning","performance"], mode:"local", url:"../jeff-dean-latency-capacity-profiler/index.html" },
  { id:"agent-hedge", name:"Agent Hedge Request Tester", desc:"Monte Carlo simulation of request hedging: benchmark P50/P99 tail latency vs extra-call overhead.", tags:["agent","latency","benchmark"], mode:"local", url:"../agent-hedge-request-tester/index.html" },
  { id:"edgeguard", name:"EdgeGuard AI", desc:"Real dual-engine inference router: Groq primary, speculative Gemini fallback after 250ms, winner-take-all. Needs free-tier keys.", tags:["agent","proxy","performance"], mode:"api", url:"../edgeguard-ai/index.html" },
  { id:"tool-suite", name:"AI Engineering Tool Suite", desc:"This registry — a dashboard of every tool on the bench.", tags:["dashboard","hub"], mode:"local", url:"../tool-suite/index.html" },
  { id:"context-compactor", name:"Context Budgeting & Compactor", desc:"Token estimation plus keep-newest-lines-within-budget compaction for prompts, chats, and agent memory.", tags:["context-engineering","tokens"], mode:"local", url:"../context-compactor/index.html" },
  { id:"react-loop", name:"ReAct Loop Visualizer", desc:"Thought → Action → Observation trace inspector with step-pause controls.", tags:["harnesses","loops"], mode:"local", url:"../react-loop-visualizer/index.html" },
  { id:"mcp-inspector", name:"MCP Client Inspector", desc:"Compiles raw tool definitions into OpenAI/Gemini function-call schemas as you type.", tags:["context-engineering","mcp"], mode:"local", url:"../mcp-schema-converter/index.html" },
  { id:"schema-repair", name:"JSON Schema Repair Loop", desc:"Validates JSON against a schema subset and auto-repairs — type coercion, defaults, enum matching, bounds — in iterative passes.", tags:["harnesses","validation"], mode:"hybrid", url:"../schema-repair-engine/index.html" },
  { id:"multi-arena", name:"Multi-LLM Arena & Parallel Tester", desc:"Parallel prompt execution across Gemini and Groq with streaming TTFT, token velocity, and output diffing. Simulation mode without keys.", tags:["evaluations","benchmarking"], mode:"hybrid", url:"../multi-llm-arena/index.html" },
  { id:"rubric-judge", name:"LLM-as-a-Judge Rubric Evaluator", desc:"Grades output against your own rubric via a live judge; objective structural checks when no key is present.", tags:["evaluations","rubrics"], mode:"hybrid", url:"../llm-rubric-judge/index.html" },
  { id:"context-firewall", name:"Context Firewall & Hand-off Generator", desc:"Strips trace noise from agent chats and builds a compact, redacted state hand-off payload.", tags:["context-engineering","state"], mode:"local", url:"../context-firewall/index.html" },
  { id:"needle-haystack", name:"Needle in a Haystack Benchmarker", desc:"Real retrieval sweep: embeds a needle at each context depth and produces a recall curve. Honest prep checks without a key.", tags:["context-engineering","evaluations"], mode:"hybrid", url:"../needle-haystack-benchmarker/index.html" },
  { id:"prompt-mutation", name:"System Prompt Mutation Optimizer", desc:"Generates deterministic prompt variants and scores them against your constraints — locally or with a live judge.", tags:["context-engineering","prompts"], mode:"hybrid", url:"../prompt-mutation-optimizer/index.html" },
  { id:"hitl-gatekeeper", name:"Agentic HITL Gatekeeper", desc:"Policy engine that auto-blocks destructive tool payloads, auto-approves read-only ones, and routes the rest to a human.", tags:["harnesses","hitl"], mode:"local", url:"../hitl-gatekeeper/index.html" },
  { id:"golden-harness", name:"Golden Dataset Test Harness", desc:"Runs every prompt in your golden JSON/CSV dataset through a live model and diffs output JSON. Local dataset lint without a key.", tags:["evaluations","testing"], mode:"hybrid", url:"../golden-dataset-harness/index.html" },
  { id:"red-teamer", name:"Adversarial Edge-Case Red-Teamer", desc:"Synthesizes injection/jailbreak/extraction payloads against your system prompt and reports missing defenses.", tags:["evaluations","security"], mode:"local", url:"../adversarial-red-teamer/index.html" },
  { id:"fewshot-builder", name:"Few-Shot Canonical Example Builder", desc:"Formats and token-budgets few-shot exemplar arrays into a copy-paste prompt block.", tags:["context-engineering","prompts"], mode:"local", url:"../fewshot-example-builder/index.html" },
  { id:"latency-cost", name:"Model Latency & Cost Profiler", desc:"Monthly token spend, blended $/M, TTFT/token-speed estimates, and SLA compliance per provider tier.", tags:["evaluations","metrics"], mode:"local", url:"../latency-cost-profiler/index.html" },
  { id:"compression-bench", name:"Context Compression Benchmarker", desc:"Actually compresses your text (gzip, token trim, dedup, live LLM summary) and measures real ratios and retention.", tags:["context-engineering","benchmarking"], mode:"hybrid", url:"../compression-ratio-benchmarker/index.html" },
  { id:"gan-contract", name:"Multi-Agent GAN Contract Evaluator", desc:"Type-checked JSON contract validation with a discriminator critique report.", tags:["harnesses","evaluations"], mode:"local", url:"../gan-contract-evaluator/index.html" },
  { id:"backoff-gateway", name:"Edge Exponential Backoff Gateway", desc:"Seeded discrete-event simulation of token-bucket limiting with jittered exponential backoff — vs an unlimited baseline.", tags:["harnesses","infrastructure"], mode:"local", url:"../worker-backoff-gateway/index.html" },
  { id:"scratchpad", name:"Scratchpad State Manager", desc:"Compiles agent scratchpad state into a tamper-evident hand-off payload with a real SHA-256 integrity hash.", tags:["context-engineering","loops"], mode:"local", url:"../scratchpad-state-manager/index.html" }
];

let tagSel = document.getElementById('tagSel'), q = document.getElementById('q'), modeSel = document.getElementById('modeSel');
const MODE_LABEL = { local: 'local', hybrid: 'key-hybrid', api: 'live API' };

function init() {
  const tags = [...new Set(TOOLS.flatMap(t => t.tags))].sort();
  tags.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; tagSel.appendChild(o); });
  render();
}
function render() {
  const query = q.value.toLowerCase();
  const tag = tagSel.value;
  const mode = modeSel.value;
  const filtered = TOOLS.filter(t =>
    (!tag || t.tags.includes(tag)) &&
    (!mode || t.mode === mode) &&
    (!query || (t.name + ' ' + t.desc + ' ' + t.tags.join(' ')).toLowerCase().includes(query)));
  const counts = { local: TOOLS.filter(t => t.mode === 'local').length, hybrid: TOOLS.filter(t => t.mode === 'hybrid').length, api: TOOLS.filter(t => t.mode === 'api').length };
  document.getElementById('chips').innerHTML =
    `<span class="chip">${TOOLS.length} tools</span><span class="chip">${counts.local} local-only</span><span class="chip">${counts.hybrid} key-hybrid</span><span class="chip">${counts.api} live API</span>`;
  document.getElementById('count').textContent = filtered.length + ' of ' + TOOLS.length + ' tools shown';
  document.getElementById('grid').innerHTML = filtered.map(t =>
    `<a class="card" href="${t.url}">
       <span class="mode m-${t.mode}">${MODE_LABEL[t.mode]}</span>
       <h3>${t.name}</h3>
       <p>${t.desc}</p>
       <div class="tags">${t.tags.map(x => `<span class="tag">${x}</span>`).join('')}</div>
     </a>`).join('') ||
    '<p class="hint">no tools match — clear filters</p>';
}
init();
</script>
</body>
</html>
