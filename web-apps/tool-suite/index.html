<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Agentic Execution Graph Debugger</title>
<style>
:root{--bg:#09090b;--surface:#121215;--border:#27272a;--text:#f4f4f5;--text-muted:#a1a1aa;--accent:#3b82f6;--font-sans:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);padding:2rem 1rem;}
.container{max-width:900px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1.5rem;}
h1{font-size:1.25rem;font-weight:600;margin-bottom:0.25rem;}
p{color:var(--text-muted);font-size:0.875rem;margin-bottom:1.5rem;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;}
.node{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:0.75rem 1rem;margin-bottom:0.75rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.node.active{border-color:var(--accent);background:rgba(59,130,246,0.1);}
.badge{font-size:0.65rem;font-family:var(--font-mono);padding:0.2rem 0.4rem;border-radius:4px;text-transform:uppercase;}
.success{background:rgba(34,197,94,0.1);color:#22c55e;}
.fail{background:rgba(239,68,68,0.1);color:#ef4444;}
.console{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:1rem;font-family:var(--font-mono);font-size:0.8rem;color:var(--text-muted);white-space:pre-wrap;height:100%;min-height:160px;}
</style>
</head>
<body>
<div class="container">
<h1>Agentic Execution Graph Debugger</h1>
<p>Step-by-step state visualizer showing DAG node transitions, tool inputs/outputs, and failure states.</p>
<div class="grid">
<div>
<label style="display:block;font-size:0.75rem;font-family:var(--font-mono);color:var(--text-muted);margin-bottom:0.4rem;">DAG NODES</label>
<div class="node active" onclick="inspect(0)"><span>1. Input Parser</span><span class="badge success">Success</span></div>
<div class="node" onclick="inspect(1)"><span>2. Vector Retriever</span><span class="badge success">Success</span></div>
<div class="node" onclick="inspect(2)"><span>3. SQL Tool Executor</span><span class="badge fail">Schema Mismatch</span></div>
</div>
<div>
<label style="display:block;font-size:0.75rem;font-family:var(--font-mono);color:var(--text-muted);margin-bottom:0.4rem;">NODE TRACE</label>
<div id="console" class="console">[Node 0: Input Parser] Token Count: 142 | Status: PASSED</div>
</div>
</div>
</div>
<script>
const logs = [
    "[Node 0: Input Parser]\n- Input received\n- Tokens: 142\n- Status: PASSED",
    "[Node 1: Vector Retriever]\n- Fetched 5 chunks from Pinecone\n- Status: PASSED",
    "[Node 2: SQL Tool Executor]\n- Error: column 'active' does not exist\n- Status: FAILED (Schema Mismatch)"
];
function inspect(idx) {
    document.querySelectorAll('.node').forEach((n, i) => n.classList.toggle('active', i === idx));
    document.getElementById('console').textContent = logs[idx];
}
</script>
</body>
</html>
