<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Engineering Tool Suite</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #111827;
      --card-hover: #1f293d;
      --border: #1e293b;
      --border-focus: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --success: #34d399;
      --tag-bg: rgba(56, 189, 248, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; display: flex; flex-direction: column; gap: 20px; max-width: 1200px; margin: 0 auto; }

    header { display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
    header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
    header p { color: var(--muted); font-size: 0.9rem; }

    .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    .search-box { flex: 1; min-width: 240px; }
    input { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; outline: none; width: 100%; transition: border-color 0.2s; }
    input:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px var(--accent-glow); }
    
    .filter-tags { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .filter-btn { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
    .filter-btn.active, .filter-btn:hover { background: var(--accent); color: #000; font-weight: 600; border-color: var(--accent); }

    .tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }

    .tool-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; text-decoration: none; color: inherit; transition: all 0.2s ease; }
    .tool-card:hover { background: var(--card-hover); border-color: var(--border-focus); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card-title { font-size: 1.05rem; font-weight: 600; color: var(--text); }
    
    .status-badge { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
    .status-badge.live { background: rgba(52, 211, 153, 0.15); color: var(--success); border: 1px solid rgba(52, 211, 153, 0.3); }

    .card-desc { font-size: 0.85rem; color: var(--muted); line-height: 1.4; flex: 1; }

    .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 10px; font-size: 0.75rem; color: var(--muted); }
    .tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .tag { background: var(--tag-bg); color: var(--accent); padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-family: monospace; }

    .empty-state { text-align: center; color: var(--muted); padding: 40px; grid-column: 1 / -1; display: none; }
  </style>
</head>
<body>

  <header>
    <h1>AI Systems Engineering Hub</h1>
    <p>18 high-agency tools for context engineering, loops, harnesses, and evaluations.</p>
  </header>

  <div class="controls">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search tools by name, description, or tag..." />
    </div>
    <div class="filter-tags" id="tagFilters">
      <button class="filter-btn active" onclick="filterByTag('all', this)">All</button>
      <button class="filter-btn" onclick="filterByTag('context-engineering', this)">Context</button>
      <button class="filter-btn" onclick="filterByTag('harnesses', this)">Harnesses</button>
      <button class="filter-btn" onclick="filterByTag('loops', this)">Loops</button>
      <button class="filter-btn" onclick="filterByTag('evaluations', this)">Evaluations</button>
    </div>
  </div>

  <div class="tool-grid" id="toolGrid"></div>
  <div class="empty-state" id="emptyState">No tools matching your search filter.</div>

  <script>
    const TOOLS = [
      {
        "id": "context-compactor",
        "name": "Context Budgeting & Compactor",
        "path": "context-compactor/index.html",
        "description": "Visual token tracking and sliding-window compaction to eliminate context rot before passing context to Gemini or Groq.",
        "tags": ["web-apps", "context-engineering", "tokens", "optimization"],
        "status": "live",
        "dateAdded": "2026-07-31"
      },
      {
        "id": "react-loop-visualizer",
        "name": "ReAct Loop Visualizer",
        "path": "react-loop-visualizer/index.html",
        "description": "Trace tree inspector showing intermediate agent Thought -> Action -> Observation steps with step-pause controls.",
        "tags": ["web-apps", "harnesses", "loops", "agentic-ai"],
        "status": "live",
        "dateAdded": "2026-07-31"
      },
      {
        "id": "mcp-schema-converter",
        "name": "MCP Client Inspector",
        "path": "mcp-schema-converter/index.html",
        "description": "Inspects and compiles tool definitions into OpenAI/Gemini JSON schemas for seamless context injection.",
        "tags": ["web-apps", "mcp", "context-engineering", "tools"],
        "status": "live",
        "dateAdded": "2026-07-31"
      },
      {
        "id": "schema-repair-engine",
        "name": "JSON Schema Repair Loop",
        "path": "schema-repair-engine/index.html",
        "description": "Validates structured outputs against JSON Schema and triggers targeted correction loops upon validation failures.",
        "tags": ["web-apps", "harnesses", "validation", "json"],
        "status": "live",
        "dateAdded": "2026-07-31"
      },
      {
        "id": "multi-llm-arena",
        "name": "Multi-LLM Arena & Parallel Tester",
        "path": "multi-llm-arena/index.html",
        "description": "Run identical prompts in parallel across Gemini and Groq (Llama-3) to compare diffs, TTFT, and token velocity.",
        "tags": ["web-apps", "evaluations", "benchmarking", "multi-llm"],
        "status": "live",
        "dateAdded": "2026-07-31"
      },
      {
        "id": "llm-rubric-judge",
        "name": "LLM-as-a-Judge Rubric Evaluator",
        "path": "llm-rubric-judge/index.html",
        "description": "Automate model grading against custom multi-dimensional rubrics with explicit reasoning outputs.",
        "tags": ["web-apps", "evaluations", "rubrics", "quality"],
        "status": "live",
        "dateAdded": "2026-07-31"
      },
      {
        "id": "context-firewall",
        "name": "Context Firewall & Hand-off Generator",
        "path": "context-firewall/index.html",
        "description": "Strips out execution noise from long agent chats and exports structured state hand-off files to reset context windows.",
        "tags": ["web-apps", "context-engineering", "memory", "state"],
        "status": "live",
        "dateAdded": "2026-07-31"
      },
      {
        "id": "needle-haystack-benchmarker",
        "name": "Needle in a Haystack Benchmarker",
        "path": "needle-haystack-benchmarker/index.html",
        "description": "Tests semantic retrieval accuracy by embedding targets at varying context depth percentages (0%–100%).",
        "tags": ["web-apps", "context-engineering", "evaluations", "rag"],
        "status": "live",
        "dateAdded": "2026-07-31"
      },
      {
        "id": "prompt-mutation-optimizer",
        "name": "System Prompt Mutation Optimizer",
        "path": "prompt-mutation-optimizer/index.html",
        "description": "Iteratively mutates base prompts, evaluates variations against target criteria, and selects optimal versions.",
        "tags": ["web-apps", "context-engineering", "optimization", "prompts"],
        "status": "live",
        "dateAdded": "2026-07-31"
      },
      {
        "id": "hitl-gatekeeper",
        "name": "Agentic HITL Gatekeeper",
        "path": "hitl-gatekeeper/index.html",
        "description": "Diffs proposed agent tool calls for human-in-the-loop approval, modification, or rejection before execution.",
        "tags": ["web-apps", "harnesses", "loops", "hitl", "safety"],
        "status": "live",
        "dateAdded": "2026-07-31"
      },
      {
        "id": "golden-dataset-harness",
        "name": "Golden Dataset Test Harness",
        "path": "golden-dataset-harness/index.html",
        "description": "Batch executes CSV/JSON test cases through Cloudflare Worker edge routes to catch prompt regression errors.",
        "tags": ["web-apps", "evaluations", "testing", "regression"],
        "status": "live",
        "dateAdded": "2026-07-31"
      },
      {
        "id": "adversarial-red-teamer",
        "name": "Adversarial Edge-Case Red-Teamer",
        "path": "adversarial-red-teamer/index.html",
        "description": "Stress-tests system prompts against injection attacks, roleplay escapes, and malformed inputs.",
        "tags": ["web-apps", "evaluations", "security", "red-teaming"],
        "status": "live",
        "dateAdded": "2026-07-31"
      },
      {
        "id": "fewshot-example-builder",
        "name": "Few-Shot Canonical Example Builder",
        "path": "fewshot-example-builder/index.html",
        "description": "Curates and deduplicates input-output pairs into dense system instructions while monitoring token overhead.",
        "tags": ["web-apps", "context-engineering", "prompts", "tokens"],
        "status": "live",
        "dateAdded": "2026-07-31"
      },
      {
        "id": "latency-cost-profiler",
        "name": "Model Latency & Cost Profiler",
        "path": "latency-cost-profiler/index.html",
        "description": "Profiles real-time Time-To-First-Token (TTFT), generation speed (tok/s), and estimated cost per API execution.",
        "tags": ["web-apps", "evaluations", "metrics", "cost"],
        "status": "live",
        "dateAdded": "2026-07-31"
      },
      {
        "id": "compression-ratio-benchmarker",
        "name": "Context Compression Benchmarker",
        "path": "compression-ratio-benchmarker/index.html",
        "description": "Measures lossy vs. lossless context summarization strategies using LLM-as-a-Judge semantic similarity scores.",
        "tags": ["web-apps", "context-engineering", "benchmarking", "summarization"],
        "status": "live",
        "dateAdded": "2026-07-31"
      },
      {
        "id": "gan-contract-evaluator",
        "name": "Multi-Agent GAN Contract Evaluator",
        "path": "gan-contract-evaluator/index.html",
        "description": "Orchestrates Generator and Critique agents to refine and evaluate outputs against strict requirements prior to output.",
        "tags": ["web-apps", "harnesses", "evaluations", "agentic-ai"],
        "status": "live",
        "dateAdded": "2026-07-31"
      },
      {
        "id": "worker-backoff-gateway",
        "name": "Edge Exponential Backoff Gateway",
        "path": "worker-backoff-gateway/index.html",
        "description": "Cloudflare Worker proxy implementing jittered exponential backoff for handling HTTP 429 rate limits seamlessly.",
        "tags": ["web-apps", "infrastructure", "harnesses", "cloudflare"],
        "status": "live",
        "dateAdded": "2026-07-31"
      },
      {
        "id": "scratchpad-state-manager",
        "name": "Scratchpad State Manager",
        "path": "scratchpad-state-manager/index.html",
        "description": "Maintains an isolated updating state variable across agent iterations to prevent conversation context bloat.",
        "tags": ["web-apps", "context-engineering", "memory", "loops"],
        "status": "live",
        "dateAdded": "2026-07-31"
      }
    ];

    let currentTag = 'all';

    function renderTools(tools) {
      const grid = document.getElementById('toolGrid');
      const emptyState = document.getElementById('emptyState');
      grid.innerHTML = '';

      if (tools.length === 0) {
        emptyState.style.display = 'block';
        return;
      } else {
        emptyState.style.display = 'none';
      }

      tools.forEach(tool => {
        const card = document.createElement('a');
        card.className = 'tool-card';
        
        // Step out of tool-suite/ into sibling directories under web-apps/
        card.href = `../${tool.path}`;

        card.innerHTML = `
          <div>
            <div class="card-header">
              <div class="card-title">${tool.name}</div>
              <span class="status-badge ${tool.status}">${tool.status}</span>
            </div>
            <p class="card-desc" style="margin-top: 8px;">${tool.description}</p>
          </div>
          <div class="card-footer">
            <div class="tags">
              ${tool.tags.map(t => `<span class="tag">#${t}</span>`).join('')}
            </div>
            <span>${tool.dateAdded}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterTools() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();

      const filtered = TOOLS.filter(tool => {
        const matchesQuery = tool.name.toLowerCase().includes(query) ||
                             tool.description.toLowerCase().includes(query) ||
                             tool.tags.some(t => t.toLowerCase().includes(query));

        const matchesTag = currentTag === 'all' || tool.tags.includes(currentTag);

        return matchesQuery && matchesTag;
      });

      renderTools(filtered);
    }

    function filterByTag(tag, btnElement) {
      currentTag = tag;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
      filterTools();
    }

    document.getElementById('searchInput').addEventListener('input', filterTools);

    renderTools(TOOLS);
  </script>
</body>
</html>
