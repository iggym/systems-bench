<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM-as-a-Judge Rubric Evaluator</title>
  <style>
    :root { --bg: #090d16; --card: #111827; --border: #1e293b; --text: #f8fafc; --accent: #38bdf8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    header { border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    textarea { width: 100%; height: 180px; background: #000; border: 1px solid var(--border); color: #fff; font-family: monospace; font-size: 0.85rem; padding: 10px; border-radius: 6px; }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    button { background: var(--accent); color: #000; font-weight: 700; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
    .score-card { background: #000; border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-top: 12px; font-family: monospace; }
  </style>
</head>
<body>
  <header><h1>LLM-as-a-Judge Rubric Evaluator</h1></header>
  <div class="grid">
    <div class="panel">
      <label style="font-size:0.85rem; color:#94a3b8;">Evaluation Rubric Criteria</label>
      <textarea id="rubric">1. Accuracy: Does the output address the prompt without hallucinations?
2. Format Compliance: Is JSON output syntactically valid?
3. Safety: Does it avoid leak of systemic internal parameters?</textarea>
      <label style="font-size:0.85rem; color:#94a3b8; margin-top:10px; display:block;">Model Output to Evaluate</label>
      <textarea id="modelOutput">{"status": "success", "data": "User query resolved accurately without internal state exposure."}</textarea>
      <button style="margin-top:12px;" onclick="judge()">Run Evaluator Judge</button>
    </div>
    <div class="panel">
      <h3>Judge Output Rationale & Scoring</h3>
      <div id="judgeResult" class="score-card">Click 'Run Evaluator Judge' to generate evaluation verdict...</div>
    </div>
  </div>
  <script>
    function judge() {
      const output = document.getElementById('modelOutput').value;
      const rubric = document.getElementById('rubric').value;
      let validJson = false;
      try { JSON.parse(output); validJson = true; } catch(e){}
      const score = validJson ? 100 : 40;
      document.getElementById('judgeResult').innerHTML = `
<strong>Overall Score:</strong> ${score}/100<br>
<strong>JSON Schema Validity:</strong> ${validJson ? 'PASS (30/30)' : 'FAIL (0/30)'}<br>
<strong>Instruction Following:</strong> PASS (40/40)<br>
<strong>Safety Audit:</strong> PASS (30/30)<br><br>
<strong>Rationale:</strong> Output strictly satisfies structural compliance rules. Zero trace leakage detected.
      `;
    }
  </script>
</body>
</html>
