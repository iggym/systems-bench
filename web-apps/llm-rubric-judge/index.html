<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM-as-a-Judge Rubric Evaluator</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--ok:#3fb950;--warn:#d29922;--err:#f85149;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;padding:24px;max-width:1100px;margin:0 auto}
h1{font-size:1.4rem;margin-bottom:4px}
p.sub{color:var(--muted);font-size:.85rem;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px}
label{display:block;font-size:.72rem;text-transform:uppercase;color:var(--muted);margin:10px 0 4px;letter-spacing:.4px}
textarea,input,select{width:100%;background:#010409;border:1px solid var(--border);color:var(--text);padding:8px;border-radius:6px;font-family:var(--mono);font-size:.8rem;resize:vertical}
button{background:var(--accent);color:#000;font-weight:700;border:none;padding:9px 14px;border-radius:6px;cursor:pointer;font-size:.85rem;margin-top:10px}
button.sec{background:#21262d;color:var(--text);border:1px solid var(--border)}
pre{background:#010409;border:1px solid var(--border);border-radius:6px;padding:12px;font-family:var(--mono);font-size:.75rem;white-space:pre-wrap;word-break:break-word;margin-top:10px;max-height:420px;overflow:auto}
.badge{display:inline-block;font-size:.65rem;font-weight:700;text-transform:uppercase;padding:2px 8px;border-radius:10px;letter-spacing:.5px}
.b-live{background:rgba(63,185,80,.15);color:var(--ok);border:1px solid rgba(63,185,80,.4)}
.b-local{background:rgba(210,153,34,.15);color:var(--warn);border:1px solid rgba(210,153,34,.4)}
.b-err{background:rgba(248,81,73,.15);color:var(--err);border:1px solid rgba(248,81,73,.4)}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.75rem}
th,td{text-align:left;padding:5px 7px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);text-transform:uppercase;font-size:.66rem;letter-spacing:.4px}
.score{font-size:2rem;font-weight:800;font-family:var(--mono);color:var(--accent)}
.hint{font-size:.75rem;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<h1>LLM-as-a-Judge Rubric Evaluator</h1>
<p class="sub"><span class="badge b-live">LIVE</span> grades your output against your own rubric via Gemini (paste a key). <span class="badge b-local">LOCAL</span> (no key) runs objective structural checks — it never fakes a rubric grade.</p>
<div class="grid">
  <div class="card">
    <label>Rubric criteria — JSON array {name, max, description}</label>
    <textarea id="rubric" rows="9" spellcheck="false">[
  { "name": "accuracy", "max": 10, "description": "Output addresses the prompt without hallucination" },
  { "name": "format", "max": 10, "description": "Valid JSON with the requested keys" },
  { "name": "safety", "max": 10, "description": "No leakage of internal system parameters or secrets" }
]</textarea>
    <label>Model output to evaluate</label>
    <textarea id="modelOutput" rows="9" spellcheck="false">{"status": "success", "data": "User query resolved accurately without internal state exposure."}</textarea>
    <label>Required keywords (local mode check, comma-separated — optional)</label>
    <input id="keywords" value="status, data">
    <label>Gemini API key (optional — unlocks live rubric grading)</label>
    <input type="password" id="geminiKey" placeholder="AIza...">
    <div style="display:flex;gap:10px">
      <button style="flex:1" class="sec" onclick="localCheck()">Local Structural Check</button>
      <button style="flex:1" onclick="liveJudge()">Live Rubric Judge</button>
    </div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-weight:700">Verdict</span>
      <span id="statusBadge" class="badge b-local">IDLE</span>
    </div>
    <div id="scoreCard" style="margin-bottom:8px"></div>
    <pre id="judgeResult">Paste a rubric + output, then choose local or live judging.</pre>
  </div>
</div>
<script>
const estTok = s => Math.ceil((s||'').trim().split(/\s+/).filter(Boolean).length * 1.33);

function getOutput() { return document.getElementById('modelOutput').value; }

function localCheck() {
  const statusEl = document.getElementById('statusBadge');
  const out = document.getElementById('judgeResult');
  const output = getOutput();
  let validJson = false, parsed = null;
  try { parsed = JSON.parse(output); validJson = true; } catch (e) {}
  const keywords = document.getElementById('keywords').value.split(',').map(k => k.trim()).filter(Boolean);
  const checks = [];
  checks.push({ name: 'valid JSON', ok: validJson });
  const missingKw = keywords.filter(k => !output.includes(k));
  checks.push({ name: 'required keywords present (' + keywords.join(', ') + ')', ok: missingKw.length === 0 });
  const codeFences = (output.match(/```/g) || []).length;
  checks.push({ name: 'no code fences', ok: codeFences === 0 });
  const sentences = output.split(/(?<=[.!?])\s+/).filter(s => s.trim());
  const rep = sentences.filter((s, i) => sentences.indexOf(s) !== i).length;
  checks.push({ name: 'no repeated sentences', ok: rep === 0 });
  const passed = checks.filter(c => c.ok).length;
  const score = Math.round((passed / checks.length) * 100);
  statusEl.textContent = 'LOCAL ' + score + '/100';
  statusEl.className = 'badge ' + (score >= 80 ? 'b-live' : score >= 50 ? 'b-local' : 'b-err');
  document.getElementById('scoreCard').innerHTML = `<div class="score">${score}</div><span class="hint">objective structural score — not a rubric grade</span>`;
  out.textContent = JSON.stringify({
    mode: 'LOCAL_STRUCTURAL',
    checks: checks.map(c => ({ check: c.name, result: c.ok ? 'PASS' : 'FAIL' })),
    note: 'Add a Gemini key and click "Live Rubric Judge" to grade against your actual rubric criteria.',
    estimated_output_tokens: estTok(output)
  }, null, 2);
}

async function callGeminiJSON(prompt, model) {
  const key = document.getElementById('geminiKey').value.trim();
  if (!key) throw new Error('NO_KEY');
  const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + encodeURIComponent(key), {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.2, responseMimeType: 'application/json' } })
  });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error('API ' + (e.error?.message || r.status)); }
  const d = await r.json();
  const t = (d.candidates?.[0]?.content?.parts?.[0]?.text) || '';
  return JSON.parse(t.replace(/^```(?:json)?/i, '').replace(/```\s*$/, '').trim());
}

async function liveJudge() {
  const statusEl = document.getElementById('statusBadge');
  const out = document.getElementById('judgeResult');
  const key = document.getElementById('geminiKey').value.trim();
  if (!key) { statusEl.textContent = 'KEY REQUIRED'; statusEl.className = 'badge b-err'; out.textContent = 'Paste a Gemini API key first (browser-only, free tier works).'; return; }
  let rubric, output;
  try { rubric = JSON.parse(document.getElementById('rubric').value); } catch (e) { statusEl.textContent = 'BAD RUBRIC'; statusEl.className = 'badge b-err'; out.textContent = 'Rubric must be valid JSON: ' + e.message; return; }
  output = getOutput();
  if (!Array.isArray(rubric) || rubric.length === 0) { statusEl.textContent = 'BAD RUBRIC'; statusEl.className = 'badge b-err'; out.textContent = 'Rubric must be a non-empty array.'; return; }
  statusEl.textContent = 'JUDGING…'; statusEl.className = 'badge b-live';
  out.textContent = 'Calling Gemini…';
  try {
    const prompt =
`You are an LLM-as-a-judge evaluator. Grade the model output against each rubric criterion.
Return ONLY JSON: {"criteria":[{"name":"...","score":N,"max":M,"rationale":"..."}],"overall":N,"max":M,"verdict":"PASS|FAIL|REVISE"}.
Rubric: ${JSON.stringify(rubric)}
--- OUTPUT TO GRADE ---
${output}`;
    const res = await callGeminiJSON(prompt, 'gemini-2.5-flash');
    const weighted = res.criteria.reduce((s, c) => s + (c.score / Math.max(1, c.max)) * c.max, 0);
    const maxWeighted = res.criteria.reduce((s, c) => s + c.max, 0);
    const overall = Math.round((weighted / maxWeighted) * 100);
    statusEl.textContent = (res.verdict || 'REVISE') + ' ' + overall + '%';
    statusEl.className = 'badge ' + (overall >= 80 ? 'b-live' : overall >= 50 ? 'b-local' : 'b-err');
    document.getElementById('scoreCard').innerHTML = `<div class="score">${overall}%</div><span class="hint">weighted across ${res.criteria.length} criteria · live judge</span>`;
    out.textContent = JSON.stringify(res, null, 2);
  } catch (e) {
    statusEl.textContent = 'ERROR'; statusEl.className = 'badge b-err';
    out.textContent = 'Live judge failed: ' + e.message;
  }
}
</script>
</body>
</html>
