<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipeline Rot Diagnostic</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--ok:#3fb950;--warn:#d29922;--err:#f85149;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;padding:24px;max-width:1100px;margin:0 auto}
h1{font-size:1.4rem;margin-bottom:4px}
p.sub{color:var(--muted);font-size:.85rem;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px}
label{display:block;font-size:.72rem;text-transform:uppercase;color:var(--muted);margin:10px 0 4px;letter-spacing:.4px}
textarea,input{width:100%;background:#010409;border:1px solid var(--border);color:var(--text);padding:8px;border-radius:6px;font-family:var(--mono);font-size:.8rem;resize:vertical}
button{background:var(--accent);color:#000;font-weight:700;border:none;padding:9px 14px;border-radius:6px;cursor:pointer;font-size:.85rem;margin-top:10px}
pre{background:#010409;border:1px solid var(--border);border-radius:6px;padding:12px;font-family:var(--mono);font-size:.75rem;white-space:pre-wrap;word-break:break-word;margin-top:10px;max-height:460px;overflow:auto}
.badge{display:inline-block;font-size:.65rem;font-weight:700;text-transform:uppercase;padding:2px 8px;border-radius:10px;letter-spacing:.5px}
.b-ok{background:rgba(63,185,80,.15);color:var(--ok);border:1px solid rgba(63,185,80,.4)}
.b-warn{background:rgba(210,153,34,.15);color:var(--warn);border:1px solid rgba(210,153,34,.4)}
.b-err{background:rgba(248,81,73,.15);color:var(--err);border:1px solid rgba(248,81,73,.4)}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.75rem}
th,td{text-align:left;padding:5px 7px;border-bottom:1px solid var(--border)}
th{color:var(--muted);text-transform:uppercase;font-size:.66rem;letter-spacing:.4px}
.hint{font-size:.75rem;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<h1>Pipeline Rot Diagnostic</h1>
<p class="sub">Scores a data/ML pipeline against real decay patterns using your metric timeline — drift, step changes, volatility, staleness, and silent-failure risk. 100% local statistics; no fabricated numbers.</p>
<div class="grid">
  <div class="card">
    <label>Metric timeline — JSON array of {date, metric: value} rows (≥2 rows, ≥1 metric)</label>
    <textarea id="timelineInput" rows="14" spellcheck="false">[
  { "date": "2026-04-01", "accuracy": 0.941, "latency_ms": 118, "rows_ingested": 482000 },
  { "date": "2026-04-15", "accuracy": 0.937, "latency_ms": 121, "rows_ingested": 475000 },
  { "date": "2026-05-01", "accuracy": 0.928, "latency_ms": 132, "rows_ingested": 468000 },
  { "date": "2026-05-15", "accuracy": 0.921, "latency_ms": 141, "rows_ingested": 466000 },
  { "date": "2026-06-01", "accuracy": 0.909, "latency_ms": 155, "rows_ingested": 460000 },
  { "date": "2026-06-15", "accuracy": 0.902, "latency_ms": 178, "rows_ingested": 451000 }
]</textarea>
    <label>Metrics where LOWER is better (comma-separated; defaults: latency_ms,error_rate,cost)</label>
    <input id="lowerBetter" value="latency_ms, error_rate, cost_per_1000">
    <label>Drift alert threshold (fraction of baseline, default 0.05 = 5%)</label>
    <input id="driftThreshold" value="0.05">
    <button onclick="analyze()">Score Pipeline</button>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-weight:700">Decay report</span>
      <span id="statusBadge" class="badge b-warn">READY</span>
    </div>
    <pre id="output">Paste a timeline and click "Score Pipeline".</pre>
  </div>
</div>
<script>
const median = a => { const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const mean = a => a.reduce((s, v) => s + v, 0) / (a.length || 1);
const std = a => { const m = mean(a); return Math.sqrt(a.reduce((s, v) => s + (v - m) ** 2, 0) / (a.length || 1)); };

// least-squares slope over indices (0..n-1)
function slope(vals) {
  const n = vals.length; if (n < 2) return 0;
  const xs = [...Array(n).keys()], mx = mean(xs), my = mean(vals);
  let num = 0, den = 0;
  for (let i = 0; i < n; i++) { num += (xs[i] - mx) * (vals[i] - my); den += (xs[i] - mx) ** 2; }
  return den ? num / den : 0;
}

function analyze() {
  const statusEl = document.getElementById('statusBadge');
  const out = document.getElementById('reportOutput') || document.getElementById('output');
  try {
    const rows = JSON.parse(document.getElementById('timelineInput').value);
    if (!Array.isArray(rows) || rows.length < 2) throw new Error('need at least 2 timeline rows');
    const lowerBetter = document.getElementById('lowerBetter').value.split(',').map(s => s.trim()).filter(Boolean);
    const thresh = parseFloat(document.getElementById('driftThreshold').value) || 0.05;
    const dates = rows.map(r => r.date);
    const lastDate = dates[dates.length - 1];
    const now = new Date();
    const lastDateObj = new Date(lastDate + 'T00:00:00');
    const staleDays = isNaN(lastDateObj) ? 0 : Math.round((now - lastDateObj) / 86400000);

    const metricNames = [...new Set(rows.flatMap(r => Object.keys(r).filter(k => k !== 'date')))];

    const perMetric = metricNames.map(name => {
      const vals = rows.map(r => (r[name] === undefined ? null : Number(r[name])));
      const present = vals.filter(v => v !== null && !isNaN(v));
      const missing = vals.length - present.length;
      const base = present[0], latest = present[present.length - 1];
      const lowerIsBetter = lowerBetter.includes(name) || /latency|error|cost|p99|p95|ttft/i.test(name);
      const delta = base ? (latest - base) / Math.abs(base) : 0;
      const slp = slope(present);
      const half = present.length >> 1;
      const firstHalf = present.slice(0, half), secondHalf = present.slice(half);
      const drift = firstHalf.length && secondHalf.length && Math.abs(mean(firstHalf)) > 1e-9
        ? (mean(secondHalf) - mean(firstHalf)) / Math.abs(mean(firstHalf)) : 0;
      // step change: max consecutive jump vs median jump
      let step = 0;
      if (present.length > 2) {
        const jumps = present.slice(1).map((v, i) => Math.abs(v - present[i]));
        step = Math.max(...jumps) / (median(jumps) || 1);
      }
      const volatility = std(present.slice(-3)) / (Math.abs(mean(present.slice(-3))) || 1);
      const badDir = lowerIsBetter ? delta > 0 : delta < 0;
      const driftBad = lowerIsBetter ? drift > thresh : drift < -thresh;
      // severity 0..1
      const sev = Math.min(1, Math.max(0, Math.abs(drift) / (thresh * 4)));
      const pattern = (step > 3 ? 'STEP CHANGE' : (Math.abs(slp) / (Math.abs(mean(present)) || 1) > thresh / (present.length - 1) ? 'GRADUAL DRIFT' : (volatility > 0.15 ? 'VOLATILE' : 'HEALTHY')));
      return { name, base, latest, deltaPct: (delta * 100), driftPct: (drift * 100), step, volatility, missing, staleDays, badDir, driftBad, pattern, sev };
    });

    const flagged = perMetric.filter(m => m.driftBad || m.step > 3 || m.volatility > 0.15 || m.missing > 0 || m.staleDays > 30);
    const healthy = perMetric.filter(m => !flagged.includes(m));

    // Rot score 0-100: 55% drift severity, 20% volatility, 15% data quality, 10% staleness
    const driftScore = mean(perMetric.map(m => m.driftBad ? m.sev * 100 : 0)) || 0;
    const volScore = mean(perMetric.map(m => Math.min(100, m.volatility * 400))) || 0;
    const missingScore = mean(perMetric.map(m => Math.min(100, (m.missing / Math.max(rows.length, 1)) * 400))) || 0;
    const staleScore = Math.min(100, staleDays * 1.5);
    const rotScore = Math.round(driftScore * 0.55 + volScore * 0.2 + missingScore * 0.15 + staleScore * 0.1);

    const level = rotScore >= 60 ? 'CRITICAL' : rotScore >= 35 ? 'WARNING' : rotScore >= 15 ? 'MONITOR' : 'HEALTHY';

    const recs = [];
    if (perMetric.some(m => m.driftBad)) recs.push('Drift beyond ' + (thresh * 100).toFixed(1) + '% threshold: retrain or recalibrate ' + perMetric.filter(m => m.driftBad).map(m => m.name).join(', '));
    if (perMetric.some(m => m.step > 3)) recs.push('Step change detected (possible schema/deploy event): review recent deploys around ' + lastDate);
    if (perMetric.some(m => m.missing > 0)) recs.push('Missing metric observations — the #1 silent-failure vector: add explicit null-tracking alerts');
    if (staleDays > 30) recs.push('Timeline is ' + staleDays + ' days stale: no recent data means failures run silently');
    if (perMetric.some(m => m.volatility > 0.15)) recs.push('High volatility in tail window: tighten alert thresholds to avoid surprise');
    if (!recs.length) recs.push('No decay patterns detected. Add alerting anyway for missing data — that is where pipelines rot first.');

    statusEl.textContent = level + ' (' + rotScore + '/100)';
    statusEl.className = 'badge ' + (rotScore >= 35 ? 'b-err' : rotScore >= 15 ? 'b-warn' : 'b-ok');

    const rowsHtml = perMetric.map(m =>
      `<tr><td>${m.name}</td><td>${m.base ?? '—'}</td><td>${m.latest ?? '—'}</td><td class="${m.driftBad ? 'fail' : ''}">${m.driftPct.toFixed(1)}%</td><td>${m.step > 3 ? '⚠' : '—'}</td><td>${(m.volatility * 100).toFixed(0)}%</td><td>${m.missing}</td><td>${m.pattern}</td></tr>`).join('');

    out.innerHTML =
      `<table><tr><th>Metric</th><th>Baseline</th><th>Latest</th><th>Drift</th><th>Step</th><th>Vol</th><th>Miss</th><th>Pattern</th></tr>${rowsHtml}</table>` +
      `<p class="hint" style="margin-top:8px">Staleness: ${staleDays} days since last data point · lower-better: ${lowerBetter.join(', ') || 'none'}</p>` +
      `<p class="hint"><b>Recommendations</b></p><pre style="max-height:160px">${recs.map(r => '- ' + r).join('\n')}</pre>`;
  } catch (e) {
    statusEl.textContent = 'ERROR'; statusEl.className = 'badge b-err';
    out.textContent = 'Error: ' + e.message;
  }
}
</script>
</body>
</html>
