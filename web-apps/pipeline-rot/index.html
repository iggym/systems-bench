<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Model Drift & Semantic Regressor</title>
<style>
:root{--bg:#09090b;--surface:#121215;--border:#27272a;--text:#f4f4f5;--text-muted:#a1a1aa;--accent:#3b82f6;--font-sans:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);padding:2rem 1rem;}
.container{max-width:800px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1.5rem;}
h1{font-size:1.25rem;font-weight:600;margin-bottom:0.25rem;}
p{color:var(--text-muted);font-size:0.875rem;margin-bottom:1.5rem;}
.form-group{margin-bottom:1rem;}
label{display:block;font-size:0.75rem;font-family:var(--font-mono);color:var(--text-muted);text-transform:uppercase;margin-bottom:0.4rem;}
textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:0.6rem;border-radius:6px;font-family:var(--font-mono);font-size:0.8rem;min-height:80px;resize:vertical;}
button{background:#1a1a1e;color:var(--text);border:1px solid var(--border);padding:0.6rem 1rem;border-radius:6px;font-size:0.85rem;cursor:pointer;width:100%;margin-top:0.5rem;}
button:hover{border-color:var(--accent);}
.output{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:1rem;font-family:var(--font-mono);font-size:0.8rem;color:var(--text-muted);margin-top:1rem;white-space:pre-wrap;min-height:100px;}
</style>
</head>
<body>
<div class="container">
<h1>Model Drift & Semantic Regressor</h1>
<p>Tracks vector distance and output distribution shift against a fixed golden dataset over time.</p>
<div class="form-group"><label>Golden Baseline Dataset</label><textarea id="baseline">{"id": "gold_set_v1", "samples": 500, "avg_cosine_similarity": 0.941}</textarea></div>
<div class="form-group"><label>Current Test Batch</label><textarea id="current">{"id": "batch_current", "samples": 120, "avg_cosine_similarity": 0.882}</textarea></div>
<button onclick="runTest()">Run Semantic Regression Test</button>
<div id="output" class="output">Ready for evaluation...</div>
</div>
<script>
function runTest() {
    document.getElementById('output').textContent = "[Semantic Regressor] Baseline: 0.941 | Current Batch: 0.882\n[Delta Alert] -0.059 drift detected.\n[Status] WARNING: Distribution shift exceeds acceptable envelope threshold (0.050).";
}
</script>
</body>
</html>
