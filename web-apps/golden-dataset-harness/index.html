<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Dataset Harness — systems-bench</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b2025; --bg-raised: #242b31; --bg-card: #20262b;
    --grid-line: #2e363e; --text: #e9edf1; --text-mute: #8d99a3;
    --accent-signal: #5eead4; --accent-tag: #ff8a3d; --radius: 4px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; border-bottom: 1px solid var(--grid-line); background: var(--bg-raised); }
  .title { font-family: 'Big Shoulders', sans-serif; font-size: 24px; text-transform: uppercase; margin: 0; letter-spacing: 1px; }
  main { display: grid; grid-template-columns: 1fr 1fr; flex: 1; overflow: hidden; }
  .panel { display: flex; flex-direction: column; border-right: 1px solid var(--grid-line); overflow: hidden; }
  .panel-header { padding: 12px 24px; border-bottom: 1px solid var(--grid-line); font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-mute); text-transform: uppercase; background: var(--bg-card); display: flex; justify-content: space-between; }
  .panel-body { padding: 24px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 16px; }
  label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; color: var(--text-mute); }
  textarea { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--grid-line); padding: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; border-radius: var(--radius); outline: none; resize: none; line-height: 1.5; }
  textarea:focus { border-color: var(--accent-tag); }
  pre { background: var(--bg-raised); padding: 16px; border-radius: var(--radius); border: 1px solid var(--grid-line); font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--accent-signal); white-space: pre-wrap; word-break: break-all; margin: 0; }
  button { background: var(--bg-raised); color: var(--text); border: 1px solid var(--grid-line); padding: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; border-radius: var(--radius); cursor: pointer; transition: border-color 0.15s ease; }
  button:hover { border-color: var(--accent-tag); color: var(--accent-signal); }
</style>
</head>
<body>
<header>
  <h1 class="title">Golden Dataset Harness</h1>
</header>
<main>
  <div class="panel">
    <div class="panel-header">Golden Test Suite (JSON)</div>
    <div class="panel-body">
      <label>Input Dataset Array</label>
      <textarea id="datasetInput" spellcheck="false">[
  {
    "id": "test_01",
    "prompt": "Extract user email and account tier from: 'Contact user@domain.com, tier: enterprise'",
    "expected_json": { "email": "user@domain.com", "tier": "enterprise" }
  }
]</textarea>
      <button onclick="runTests()">Execute Regression Suite</button>
    </div>
  </div>
  <div class="panel" style="border-right: none;">
    <div class="panel-header">
      <span>Evaluation Report</span>
      <span id="testStatus" style="color:var(--accent-signal)">IDLE</span>
    </div>
    <div class="panel-body">
      <label>Execution Output Log</label>
      <pre id="reportOutput">Click 'Execute Regression Suite' to run evaluations.</pre>
    </div>
  </div>
</main>
<script>
  const datasetInput = document.getElementById('datasetInput');
  const reportOutput = document.getElementById('reportOutput');
  const testStatus = document.getElementById('testStatus');

  function runTests() {
    try {
      const dataset = JSON.parse(datasetInput.value);
      let passed = 0;
      let total = dataset.length;
      let logs = [];

      dataset.forEach((item, idx) => {
        // Deterministic validation check mock
        const success = item.id && item.prompt && item.expected_json;
        if (success) passed++;
        logs.push(`[${item.id || 'case_' + idx}] -> ${success ? 'PASS (Assertion Match)' : 'FAIL (Schema Mismatch)'}`);
      });

      testStatus.textContent = passed === total ? "PASSED" : "FAILURES DETECTED";
      testStatus.style.color = passed === total ? "var(--accent-signal)" : "#ff5e5e";

      reportOutput.textContent = JSON.stringify({
        total_cases: total,
        passed_assertions: passed,
        failed_assertions: total - passed,
        pass_rate: `${((passed / total) * 100).toFixed(1)}%`,
        execution_logs: logs
      }, null, 2);
    } catch (e) {
      testStatus.textContent = "SYNTAX ERROR";
      testStatus.style.color = "#ff5e5e";
      reportOutput.textContent = "Error: Invalid JSON format in test suite definition.";
    }
  }
</script>
</body>
</html>
