<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worker Backoff Gateway — systems-bench</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b2025; --bg-raised: #242b31; --bg-card: #20262b;
    --grid-line: #2e363e; --text: #e9edf1; --text-mute: #8d99a3;
    --accent-signal: #5eead4; --accent-tag: #ff8a3d; --radius: 4px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; border-bottom: 1px solid var(--grid-line); background: var(--bg-raised); }
  .title { font-family: 'Big Shoulders', sans-serif; font-size: 24px; text-transform: uppercase; margin: 0; letter-spacing: 1px; }
  main { display: grid; grid-template-columns: 1fr 1fr; flex: 1; overflow: hidden; }
  .panel { display: flex; flex-direction: column; border-right: 1px solid var(--grid-line); overflow: hidden; }
  .panel-header { padding: 12px 24px; border-bottom: 1px solid var(--grid-line); font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-mute); text-transform: uppercase; background: var(--bg-card); }
  .panel-body { padding: 24px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 16px; }
  label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; color: var(--text-mute); }
  input, select { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--grid-line); padding: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; border-radius: var(--radius); outline: none; }
  input:focus, select:focus { border-color: var(--accent-tag); }
  pre { background: var(--bg-raised); padding: 16px; border-radius: var(--radius); border: 1px solid var(--grid-line); font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--accent-signal); white-space: pre-wrap; word-break: break-all; margin: 0; }
  button { background: var(--bg-raised); color: var(--text); border: 1px solid var(--grid-line); padding: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; border-radius: var(--radius); cursor: pointer; transition: border-color 0.15s ease; }
  button:hover { border-color: var(--accent-tag); color: var(--accent-signal); }
</style>
</head>
<body>
<header>
  <h1 class="title">Worker Backoff Gateway</h1>
</header>
<main>
  <div class="panel">
    <div class="panel-header">Backoff Configuration</div>
    <div class="panel-body">
      <div>
        <label>Max Retry Attempts</label>
        <input type="number" id="maxRetries" value="5" />
      </div>
      <div>
        <label>Base Delay (ms)</label>
        <input type="number" id="baseDelay" value="500" />
      </div>
      <div>
        <label>Jitter Strategy</label>
        <select id="jitterStrategy">
          <option value="full">Full Jitter (Decorrelated / Randomized)</option>
          <option value="equal">Equal Jitter (Half Constant, Half Random)</option>
          <option value="none">None (Pure Exponential)</option>
        </select>
      </div>
      <button onclick="calculateBackoff()">Generate Backoff Schedule</button>
    </div>
  </div>
  <div class="panel" style="border-right: none;">
    <div class="panel-header">Calculated Retry Schedule</div>
    <div class="panel-body">
      <label>Schedule Manifest</label>
      <pre id="scheduleOutput">Click 'Generate Backoff Schedule' to calculate intervals.</pre>
    </div>
  </div>
</main>
<script>
  const maxRetries = document.getElementById('maxRetries');
  const baseDelay = document.getElementById('baseDelay');
  const jitterStrategy = document.getElementById('jitterStrategy');
  const scheduleOutput = document.getElementById('scheduleOutput');

  function calculateBackoff() {
    const retries = parseInt(maxRetries.value) || 3;
    const base = parseFloat(baseDelay.value) || 100;
    const strategy = jitterStrategy.value;

    let schedule = [];

    for (let i = 1; i <= retries; i++) {
      let exponentialDelay = base * Math.pow(2, i - 1);
      let jitteredDelay = exponentialDelay;

      if (strategy === 'full') {
        jitteredDelay = Math.random() * exponentialDelay;
      } else if (strategy === 'equal') {
        const half = exponentialDelay / 2;
        jitteredDelay = half + (Math.random() * half);
      }

      schedule.push({
        attempt: i,
        raw_exponential_ms: Math.round(exponentialDelay),
        computed_delay_ms: Math.round(jitteredDelay)
      });
    }

    scheduleOutput.textContent = JSON.stringify({
      max_retries: retries,
      base_delay_ms: base,
      jitter_algorithm: strategy,
      retry_schedule: schedule
    }, null, 2);
  }

  calculateBackoff();
</script>
</body>
</html>
