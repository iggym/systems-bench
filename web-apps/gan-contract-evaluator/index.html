<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAN Contract Evaluator — systems-bench</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b2025; --bg-raised: #242b31; --bg-card: #20262b;
    --grid-line: #2e363e; --text: #e9edf1; --text-mute: #8d99a3;
    --accent-signal: #5eead4; --accent-tag: #ff8a3d; --accent-err: #ff5e5e; --radius: 4px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; border-bottom: 1px solid var(--grid-line); background: var(--bg-raised); }
  .title { font-family: 'Big Shoulders', sans-serif; font-size: 24px; text-transform: uppercase; margin: 0; letter-spacing: 1px; }
  main { display: grid; grid-template-columns: 1fr 1fr; flex: 1; overflow: hidden; }
  .panel { display: flex; flex-direction: column; border-right: 1px solid var(--grid-line); overflow: hidden; }
  .panel-header { padding: 12px 24px; border-bottom: 1px solid var(--grid-line); font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-mute); text-transform: uppercase; background: var(--bg-card); display: flex; justify-content: space-between; }
  .panel-body { padding: 24px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 16px; }
  label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; color: var(--text-mute); }
  textarea { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--grid-line); padding: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; border-radius: var(--radius); outline: none; resize: none; line-height: 1.5; min-height: 140px; }
  textarea:focus { border-color: var(--accent-tag); }
  pre { background: var(--bg-raised); padding: 16px; border-radius: var(--radius); border: 1px solid var(--grid-line); font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--accent-signal); white-space: pre-wrap; word-break: break-all; margin: 0; }
  button { background: var(--bg-raised); color: var(--text); border: 1px solid var(--grid-line); padding: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; border-radius: var(--radius); cursor: pointer; transition: border-color 0.15s ease; }
  button:hover { border-color: var(--accent-tag); color: var(--accent-signal); }
</style>
</head>
<body>
<header>
  <h1 class="title">GAN Contract Evaluator</h1>
</header>
<main>
  <div class="panel">
    <div class="panel-header">Generator Output & Schema Contract</div>
    <div class="panel-body">
      <label>Target JSON Schema Contract</label>
      <textarea id="schemaInput" spellcheck="false">{
  "type": "object",
  "required": ["status", "error_code", "data"],
  "properties": {
    "status": { "type": "string" },
    "error_code": { "type": "integer" }
  }
}</textarea>
      <label>Generator Output Payload</label>
      <textarea id="payloadInput" spellcheck="false">{
  "status": "success",
  "error_code": 0,
  "data": { "user_id": "9948" }
}</textarea>
      <button onclick="runCritiqueLoop()">Execute Discriminator Loop</button>
    </div>
  </div>
  <div class="panel" style="border-right: none;">
    <div class="panel-header">
      <span>Discriminator Audit Report</span>
      <span id="verdictBadge" style="color:var(--accent-signal)">IDLE</span>
    </div>
    <div class="panel-body">
      <label>Adversarial Critique Log</label>
      <pre id="auditOutput">Click 'Execute Discriminator Loop' to validate payload against schema contract.</pre>
    </div>
  </div>
</main>
<script>
  const schemaInput = document.getElementById('schemaInput');
  const payloadInput = document.getElementById('payloadInput');
  const auditOutput = document.getElementById('auditOutput');
  const verdictBadge = document.getElementById('verdictBadge');

  function runCritiqueLoop() {
    try {
      const schema = JSON.parse(schemaInput.value);
      const payload = JSON.parse(payloadInput.value);

      const requiredKeys = schema.required || [];
      const payloadKeys = Object.keys(payload);
      const missingKeys = requiredKeys.filter(k => !payloadKeys.includes(k));

      const isPassed = missingKeys.length === 0;

      verdictBadge.textContent = isPassed ? "CONTRACT VALIDATED" : "CONTRACT VIOLATION";
      verdictBadge.style.color = isPassed ? "var(--accent-signal)" : "var(--accent-err)";

      auditOutput.textContent = JSON.stringify({
        discriminator_verdict: isPassed ? "PASS" : "REJECT",
        schema_required_fields: requiredKeys,
        payload_provided_fields: payloadKeys,
        violations: missingKeys.length > 0 ? missingKeys.map(k => `Missing required key: '${k}'`) : [],
        correction_instruction: isPassed ? null : "Regenerate payload ensuring all required schema keys are present and correctly typed."
      }, null, 2);
    } catch (e) {
      verdictBadge.textContent = "SYNTAX ERROR";
      verdictBadge.style.color = "var(--accent-err)";
      auditOutput.textContent = "Error: Invalid JSON syntax in schema contract or generator payload.";
    }
  }
</script>
</body>
</html>
