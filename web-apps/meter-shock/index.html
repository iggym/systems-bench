<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cost-per-Token Velocity Tracker</title>
<style>
:root{--bg:#09090b;--surface:#121215;--border:#27272a;--text:#f4f4f5;--text-muted:#a1a1aa;--accent:#3b82f6;--font-sans:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);padding:2rem 1rem;}
.container{max-width:800px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1.5rem;}
h1{font-size:1.25rem;font-weight:600;margin-bottom:0.25rem;}
p{color:var(--text-muted);font-size:0.875rem;margin-bottom:1.5rem;}
.form-group{margin-bottom:1rem;}
label{display:block;font-size:0.75rem;font-family:var(--font-mono);color:var(--text-muted);text-transform:uppercase;margin-bottom:0.4rem;}
input, select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:0.6rem;border-radius:6px;font-size:0.85rem;}
button{background:#1a1a1e;color:var(--text);border:1px solid var(--border);padding:0.6rem 1rem;border-radius:6px;font-size:0.85rem;cursor:pointer;width:100%;margin-top:0.5rem;}
button:hover{border-color:var(--accent);}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.5rem;}
.card{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:1rem;text-align:center;}
.val{font-size:1.5rem;font-weight:600;font-family:var(--font-mono);color:var(--text);margin-top:0.25rem;}
</style>
</head>
<body>
<div class="container">
<h1>Cost-per-Token Velocity Tracker</h1>
<p>Live sliding-window budget burn estimator calculating cost-per-successful-task.</p>
<div class="form-group"><label>Model Tier</label><select id="model"><option value="9">Claude 3.5 Sonnet ($9/M blended)</option><option value="6.25">GPT-4o ($6.25/M blended)</option></select></div>
<div class="form-group"><label>Completed Tasks</label><input type="number" id="tasks" value="142"></div>
<div class="form-group"><label>Total Tokens Dispatched</label><input type="number" id="tokens" value="4520000"></div>
<button onclick="calc()">Calculate Velocity</button>
<div class="metrics">
<div class="card"><label>Cost / Task</label><div id="cost-task" class="val">$0.00</div></div>
<div class="card"><label>Hourly Burn</label><div id="cost-burn" class="val">$0.00</div></div>
</div>
</div>
<script>
function calc() {
    let rate = parseFloat(document.getElementById('model').value);
    let tasks = parseFloat(document.getElementById('tasks').value) || 1;
    let tokens = parseFloat(document.getElementById('tokens').value) || 0;
    let total = (tokens / 1000000) * rate;
    document.getElementById('cost-task').textContent = `$${(total/tasks).toFixed(4)}`;
    document.getElementById('cost-burn').textContent = `$${(total*12).toFixed(2)}/hr`;
}
calc();
</script>
</body>
</html>
