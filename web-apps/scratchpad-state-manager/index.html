<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scratchpad State Manager</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--ok:#3fb950;--warn:#d29922;--err:#f85149;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;padding:24px;max-width:1100px;margin:0 auto}
h1{font-size:1.4rem;margin-bottom:4px}
p.sub{color:var(--muted);font-size:.85rem;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px}
label{display:block;font-size:.72rem;text-transform:uppercase;color:var(--muted);margin:10px 0 4px;letter-spacing:.4px}
textarea,input{width:100%;background:#010409;border:1px solid var(--border);color:var(--text);padding:8px;border-radius:6px;font-family:var(--mono);font-size:.8rem;resize:vertical}
button{background:var(--accent);color:#000;font-weight:700;border:none;padding:9px 14px;border-radius:6px;cursor:pointer;font-size:.85rem;margin-top:10px}
pre{background:#010409;border:1px solid var(--border);border-radius:6px;padding:12px;font-family:var(--mono);font-size:.75rem;white-space:pre-wrap;word-break:break-word;margin-top:10px;max-height:380px;overflow:auto}
.badge{display:inline-block;font-size:.65rem;font-weight:700;text-transform:uppercase;padding:2px 8px;border-radius:10px;letter-spacing:.5px}
.b-ok{background:rgba(63,185,80,.15);color:var(--ok);border:1px solid rgba(63,185,80,.4)}
.b-err{background:rgba(248,81,73,.15);color:var(--err);border:1px solid rgba(248,81,73,.4)}
.b-warn{background:rgba(210,153,34,.15);color:var(--warn);border:1px solid rgba(210,153,34,.4)}
.stat{display:inline-block;background:#010409;border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-family:var(--mono);font-size:.78rem;margin:4px 4px 0 0}
.hint{font-size:.75rem;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<h1>Scratchpad State Manager</h1>
<p class="sub">Isolates execution memory state into a tamper-evident hand-off payload for multi-turn agent loops. Runs 100% locally.</p>
<div class="grid">
  <div class="card">
    <label>Active scratchpad state (JSON)</label>
    <textarea id="stateInput" rows="16" spellcheck="false">{
  "session_id": "sess_99482_delta",
  "intermediate_findings": [
    "Identified primary bottleneck in database connection pool.",
    "Drafting migration plan for connection pooling proxy."
  ],
  "pending_tools": ["execute_migration", "verify_health_check"],
  "lock_status": "unlocked"
}</textarea>
    <button onclick="compileState()">Compile Hand-off Payload</button>
    <div id="compileStats"></div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-weight:700">Hand-off payload</span>
      <span id="statusBadge" class="badge b-warn">IDLE</span>
    </div>
    <pre id="stateOutput">Click "Compile Hand-off Payload" to generate the isolated state block.</pre>
    <label>Tamper check — paste a received hand-off payload here</label>
    <textarea id="verifyInput" rows="5" spellcheck="false"></textarea>
    <button class="sec" onclick="verifyHash()">Verify Integrity</button>
    <div id="verifyResult"></div>
  </div>
</div>
<script>
const estTok = s => Math.ceil((s||'').trim().split(/\s+/).filter(Boolean).length * 1.33);

// Real SHA-256 via WebCrypto (https/file-with-flag). Falls back to FNV-1a if Crypto.subtle is unavailable.
async function sha256hex(str) {
  const bytes = new TextEncoder().encode(str);
  if (globalThis.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', bytes);
    return 'sha256_' + [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
  }
  // FNV-1a 32-bit fallback (non-cryptographic) — clearly labeled.
  let h = 0x811c9dc5;
  for (const b of bytes) { h ^= b; h = Math.imul(h, 0x01000193) >>> 0; }
  return 'fnv1a_' + h.toString(16).padStart(8,'0') + '_WEAK';
}

async function compileState() {
  const statusEl = document.getElementById('statusBadge');
  const outEl = document.getElementById('stateOutput');
  try {
    const state = JSON.parse(document.getElementById('stateInput').value);
    const canonical = JSON.stringify({ scratchpad: state }, null, 2);
    const payload = {
      schema_version: 2,
      created_at: new Date().toISOString(),
      mode: 'single_agent',
      isolated_scratchpad: state,
      token_overhead: estTok(canonical),
      integrity: { algo: 'sha256', hash: await sha256hex(canonical) }
    };
    outEl.textContent = JSON.stringify(payload, null, 2);
    statusEl.textContent = 'COMPILED';
    statusEl.className = 'badge b-ok';
    document.getElementById('compileStats').innerHTML =
      `<span class="stat">Payload: ${canonical.length} chars</span><span class="stat">~${payload.token_overhead} tokens</span><span class="stat">${payload.integrity.algo}</span>`;
  } catch (e) {
    statusEl.textContent = 'SYNTAX ERROR';
    statusEl.className = 'badge b-err';
    outEl.textContent = 'Error: invalid JSON in scratchpad state.\n' + e.message;
  }
}

async function verifyHash() {
  const el = document.getElementById('verifyResult');
  try {
    const payload = JSON.parse(document.getElementById('verifyInput').value);
    if (!payload.integrity || !payload.integrity.hash) throw new Error('payload has no integrity.hash');
    const canonical = JSON.stringify({ scratchpad: payload.isolated_scratchpad }, null, 2);
    const expected = payload.integrity.hash;
    const algo = expected.startsWith('fnv1a_') ? 'fnv1a' : 'sha256';
    const actual = algo === 'fnv1a'
      ? await sha256hex(canonical).then(h => 'fnv1a_' + (parseInt(h.split('_')[1], 16)).toString(16).padStart(8,'0') + '_WEAK')
      : await sha256hex(canonical);
    const ok = actual === expected;
    el.innerHTML = `<div class="badge ${ok ? 'b-ok' : 'b-err'}" style="margin-top:10px">${ok ? 'INTEGRITY OK — payload unmodified' : 'TAMPERED — hash mismatch'}</div>
      <pre style="max-height:140px">stored: ${expected}\ncomputed: ${actual}</pre>`;
  } catch (e) {
    el.innerHTML = `<div class="badge b-err" style="margin-top:10px">INVALID PAYLOAD</div><p class="hint">${e.message}</p>`;
  }
}
</script>
</body>
</html>
