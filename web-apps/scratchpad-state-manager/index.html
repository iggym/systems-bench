<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scratchpad State Manager — systems-bench</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b2025; --bg-raised: #242b31; --bg-card: #20262b;
    --grid-line: #2e363e; --text: #e9edf1; --text-mute: #8d99a3;
    --accent-signal: #5eead4; --accent-tag: #ff8a3d; --radius: 4px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; border-bottom: 1px solid var(--grid-line); background: var(--bg-raised); }
  .title { font-family: 'Big Shoulders', sans-serif; font-size: 24px; text-transform: uppercase; margin: 0; letter-spacing: 1px; }
  main { display: grid; grid-template-columns: 1fr 1fr; flex: 1; overflow: hidden; }
  .panel { display: flex; flex-direction: column; border-right: 1px solid var(--grid-line); overflow: hidden; }
  .panel-header { padding: 12px 24px; border-bottom: 1px solid var(--grid-line); font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-mute); text-transform: uppercase; background: var(--bg-card); display: flex; justify-content: space-between; }
  .panel-body { padding: 24px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 16px; }
  label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; color: var(--text-mute); }
  textarea { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--grid-line); padding: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; border-radius: var(--radius); outline: none; resize: none; line-height: 1.5; min-height: 160px; }
  textarea:focus { border-color: var(--accent-tag); }
  pre { background: var(--bg-raised); padding: 16px; border-radius: var(--radius); border: 1px solid var(--grid-line); font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--accent-signal); white-space: pre-wrap; word-break: break-all; margin: 0; }
  button { background: var(--bg-raised); color: var(--text); border: 1px solid var(--grid-line); padding: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; border-radius: var(--radius); cursor: pointer; transition: border-color 0.15s ease; }
  button:hover { border-color: var(--accent-tag); color: var(--accent-signal); }
</style>
</head>
<body>
<header>
  <h1 class="title">Scratchpad State Manager</h1>
</header>
<main>
  <div class="panel">
    <div class="panel-header">Scratchpad State Registry (JSON)</div>
    <div class="panel-body">
      <label>Active Scratchpad Variables</label>
      <textarea id="stateInput" spellcheck="false">{
  "session_id": "sess_99482_delta",
  "intermediate_findings": [
    "Identified primary bottleneck in database connection pool.",
    "Drafting migration plan for connection pooling proxy."
  ],
  "pending_tools": ["execute_migration", "verify_health_check"],
  "lock_status": "unlocked"
}</textarea>
      <button onclick="compileState()">Isolate & Compile State Payload</button>
    </div>
  </div>
  <div class="panel" style="border-right: none;">
    <div class="panel-header">
      <span>Isolated State Hand-off</span>
      <span id="stateStatus" style="color:var(--accent-signal)">CLEAN</span>
    </div>
    <div class="panel-body">
      <label>Compiled Handoff Manifest</label>
      <pre id="stateOutput">Click 'Isolate & Compile State Payload' to generate agent hand-off block.</pre>
    </div>
  </div>
</main>
<script>
  const stateInput = document.getElementById('stateInput');
  const stateOutput = document.getElementById('stateOutput');
  const stateStatus = document.getElementById('stateStatus');

  function compileState() {
    try {
      const state = JSON.parse(stateInput.value);
      
      const payload = {
        timestamp: new Date().toISOString(),
        isolated_scratchpad: state,
        token_overhead: Math.ceil(JSON.stringify(state).length / 4),
        integrity_hash: "sha256_" + Math.random().toString(36.substring(2, 10))
      };

      stateOutput.textContent = JSON.stringify(payload, null, 2);
      stateStatus.textContent = "COMPILED";
      stateStatus.style.color = "var(--accent-signal)";
    } catch (e) {
      stateStatus.textContent = "SYNTAX ERROR";
      stateStatus.style.color = "#ff5e5e";
      stateOutput.textContent = "Error: Invalid JSON format in scratchpad variable definitions.";
    }
  }

  compileState();
</script>
</body>
</html>
