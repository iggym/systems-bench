<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Context Budgeting & Compactor</title>
  <style>
    :root { --bg: #090d16; --card: #111827; --border: #1e293b; --text: #f8fafc; --muted: #94a3b8; --accent: #38bdf8; --danger: #f43f5e; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    header { border-bottom: 1px solid var(--border); padding-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    textarea { width: 100%; height: 260px; background: #000; border: 1px solid var(--border); color: #34d399; font-family: monospace; font-size: 0.85rem; padding: 12px; border-radius: 6px; resize: vertical; }
    .metrics { display: flex; gap: 12px; font-family: monospace; font-size: 0.85rem; }
    .stat { background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 4px; border: 1px solid var(--border); }
    button { background: var(--accent); color: #000; font-weight: 700; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    .controls { display: flex; gap: 10px; align-items: center; }
    input[type="number"] { background: #000; border: 1px solid var(--border); color: #fff; padding: 6px; border-radius: 4px; width: 100px; }
  </style>
</head>
<body>
  <header>
    <h1>Context Budgeting & Compactor</h1>
    <span class="stat">Zero-Dependency Token Trimmer</span>
  </header>
  <div class="controls panel">
    <label>Token Target Limit: <input type="number" id="limit" value="1000" step="100"></label>
    <button onclick="compact()">Prune & Compact Context</button>
  </div>
  <div class="grid">
    <div class="panel">
      <h3>Raw Context Payload</h3>
      <textarea id="rawText" placeholder="Paste system prompts, chat history, or agent memory trace here..."></textarea>
      <div class="metrics"><span class="stat" id="rawTokens">Est. Tokens: 0</span><span class="stat" id="rawChars">Chars: 0</span></div>
    </div>
    <div class="panel">
      <h3>Compacted Context Output</h3>
      <textarea id="compactText" readonly placeholder="Compacted output will appear here..."></textarea>
      <div class="metrics"><span class="stat" id="compTokens">Est. Tokens: 0</span><span class="stat" id="reduction">Saved: 0%</span></div>
    </div>
  </div>
  <script>
    const estTok = s => Math.ceil((s || '').trim().split(/\s+/).filter(Boolean).length * 1.33);
    const updateStats = () => {
      const raw = document.getElementById('rawText').value;
      const t = estTok(raw);
      document.getElementById('rawTokens').textContent = `Est. Tokens: ${t}`;
      document.getElementById('rawChars').textContent = `Chars: ${raw.length}`;
    };
    document.getElementById('rawText').addEventListener('input', updateStats);
    function compact() {
      const raw = document.getElementById('rawText').value;
      const limit = parseInt(document.getElementById('limit').value, 10) || 1000;
      const lines = raw.split('\n').filter(l => l.trim().length > 0);
      let out = [], curTok = 0;
      for (let i = lines.length - 1; i >= 0; i--) {
        const lineTok = estTok(lines[i]);
        if (curTok + lineTok > limit) break;
        out.unshift(lines[i]);
        curTok += lineTok;
      }
      const res = out.join('\n');
      document.getElementById('compactText').value = res;
      const compTok = estTok(res);
      const rawTok = estTok(raw);
      const saved = rawTok ? Math.round(((rawTok - compTok) / rawTok) * 100) : 0;
      document.getElementById('compTokens').textContent = `Est. Tokens: ${compTok}`;
      document.getElementById('reduction').textContent = `Saved: ${saved}%`;
    }
  </script>
</body>
</html>
