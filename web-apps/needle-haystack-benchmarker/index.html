<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Needle Haystack Benchmarker — systems-bench</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b2025; --bg-raised: #242b31; --bg-card: #20262b;
    --grid-line: #2e363e; --text: #e9edf1; --text-mute: #8d99a3;
    --accent-signal: #5eead4; --accent-tag: #ff8a3d; --radius: 4px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; border-bottom: 1px solid var(--grid-line); background: var(--bg-raised); }
  .title { font-family: 'Big Shoulders', sans-serif; font-size: 24px; text-transform: uppercase; margin: 0; letter-spacing: 1px; }
  main { display: grid; grid-template-columns: 1fr 1fr; flex: 1; overflow: hidden; }
  .panel { display: flex; flex-direction: column; border-right: 1px solid var(--grid-line); overflow: hidden; }
  .panel-header { padding: 12px 24px; border-bottom: 1px solid var(--grid-line); font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-mute); text-transform: uppercase; background: var(--bg-card); }
  .panel-body { padding: 24px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 16px; }
  label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; color: var(--text-mute); }
  input, textarea { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--grid-line); padding: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; border-radius: var(--radius); outline: none; }
  input:focus, textarea:focus { border-color: var(--accent-tag); }
  pre { background: var(--bg-raised); padding: 16px; border-radius: var(--radius); border: 1px solid var(--grid-line); font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--accent-signal); white-space: pre-wrap; word-break: break-all; margin: 0; }
</style>
</head>
<body>
<header>
  <h1 class="title">Needle Haystack Benchmarker</h1>
</header>
<main>
  <div class="panel">
    <div class="panel-header">Test Parameters</div>
    <div class="panel-body">
      <div>
        <label>Needle Statement (Target Fact)</label>
        <input type="text" id="needleInput" value="The secret system passcode is 7749-DELTA." />
      </div>
      <div>
        <label>Haystack Depth Position (%)</label>
        <input type="number" id="depthInput" value="50" min="0" max="100" />
      </div>
      <div>
        <label>Context Length (Tokens)</label>
        <input type="number" id="lengthInput" value="32000" />
      </div>
    </div>
  </div>
  <div class="panel" style="border-right: none;">
    <div class="panel-header">Retrieval Verification Harness</div>
    <div class="panel-body">
      <label>Generated Injection Manifest</label>
      <pre id="outputManifest"></pre>
      <label>Recall Probability Score</label>
      <pre id="outputScore"></pre>
    </div>
  </div>
</main>
<script>
  const needleInput = document.getElementById('needleInput');
  const depthInput = document.getElementById('depthInput');
  const lengthInput = document.getElementById('lengthInput');
  const outputManifest = document.getElementById('outputManifest');
  const outputScore = document.getElementById('outputScore');

  function evaluate() {
    const needle = needleInput.value;
    const depth = parseFloat(depthInput.value) || 0;
    const length = parseInt(lengthInput.value) || 0;

    outputManifest.textContent = JSON.stringify({
      target_needle: needle,
      injection_depth_pct: depth,
      context_window_tokens: length,
      approx_character_offset: Math.floor((length * 4) * (depth / 100))
    }, null, 2);

    let score = "100% (High Confidence Retrieval)";
    if (depth > 85 && length > 64000) score = "42% (Recency Bias / Lost in the Middle Risk)";
    else if (length > 128000) score = "78% (Attention Degradation Detected)";

    outputScore.textContent = `Predicted Recall Accuracy: ${score}\nRecommended Chunk Strategy: Hierarchical Parent-Child Indexing`;
  }

  needleInput.addEventListener('input', evaluate);
  depthInput.addEventListener('input', evaluate);
  lengthInput.addEventListener('input', evaluate);
  evaluate();
</script>
</body>
</html>
