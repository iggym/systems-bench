<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Hedge Request Tester</title>
  <style>
    :root { --bg: #090d16; --card: #111827; --text: #f3f4f6; --accent: #10b981; --border: #1f2937; }
    body { background: var(--bg); color: var(--text); font-family: monospace; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 8px; }
    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; font-size: 0.85rem; }
    input { width: 100%; padding: 8px; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 4px; box-sizing: border-box; }
    button { background: var(--accent); color: #000; font-weight: bold; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; }
    .results { background: #000; padding: 15px; border-radius: 4px; border: 1px solid var(--border); margin-top: 20px; }
    .stat-row { display: flex; justify-content: space-between; padding: 5px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Jeff Dean Tail-Latency Hedging Simulator</h2>
    <p style="font-size: 0.85rem; color: #9ca3af;">Simulates LLM/Agent tool invocations with primary requests and speculative hedge requests fired at a percentile delay threshold.</p>
    
    <div class="controls">
      <div>
        <label>Total Agent Calls</label>
        <input type="number" id="totalCalls" value="1000">
      </div>
      <div>
        <label>Base Mean Latency (ms)</label>
        <input type="number" id="meanLat" value="150">
      </div>
      <div>
        <label>Tail Delay Spikes (ms)</label>
        <input type="number" id="tailSpike" value="1200">
      </div>
      <div>
        <label>Tail Spike Rate (%)</label>
        <input type="number" id="spikeRate" value="5">
      </div>
      <div>
        <label>Hedge Delay Threshold (ms)</label>
        <input type="number" id="hedgeThreshold" value="200">
      </div>
    </div>
    <button onclick="runSimulation()">Execute Benchmark</button>

    <div class="results">
      <div class="stat-row"><span>Standard P50 Latency:</span><span id="p50Standard">-</span></div>
      <div class="stat-row"><span>Standard P99 Latency:</span><span id="p99Standard" style="color: #ef4444;">-</span></div>
      <hr style="border-color: var(--border);">
      <div class="stat-row"><span>Hedged P50 Latency:</span><span id="p50Hedged">-</span></div>
      <div class="stat-row"><span>Hedged P99 Latency:</span><span id="p99Hedged" style="color: var(--accent);">-</span></div>
      <div class="stat-row"><span>Extra Request Overhead:</span><span id="overhead">-</span></div>
    </div>
  </div>

  <script>
    function simulateLatency(mean, spike, spikeRate) {
      if (Math.random() * 100 < spikeRate) {
        return mean + spike + (Math.random() * 200);
      }
      return mean + (Math.random() * 40 - 20);
    }

    function runSimulation() {
      const calls = parseInt(document.getElementById('totalCalls').value);
      const mean = parseFloat(document.getElementById('meanLat').value);
      const spike = parseFloat(document.getElementById('tailSpike').value);
      const spikeRate = parseFloat(document.getElementById('spikeRate').value);
      const hedgeThreshold = parseFloat(document.getElementById('hedgeThreshold').value);

      let standardLatencies = [];
      let hedgedLatencies = [];
      let extraRequests = 0;

      for (let i = 0; i < calls; i++) {
        let req1 = simulateLatency(mean, spike, spikeRate);
        standardLatencies.push(req1);

        if (req1 > hedgeThreshold) {
          extraRequests++;
          let req2 = simulateLatency(mean, spike, spikeRate);
          // Effective latency is when the hedge was sent + time req2 took, OR req1 finishing
          let effectiveHedged = Math.min(req1, hedgeThreshold + req2);
          hedgedLatencies.push(effectiveHedged);
        } else {
          hedgedLatencies.push(req1);
        }
      }

      standardLatencies.sort((a, b) => a - b);
      hedgedLatencies.sort((a, b) => a - b);

      const p50Idx = Math.floor(calls * 0.5);
      const p99Idx = Math.floor(calls * 0.99);

      document.getElementById('p50Standard').textContent = standardLatencies[p50Idx].toFixed(1) + ' ms';
      document.getElementById('p99Standard').textContent = standardLatencies[p99Idx].toFixed(1) + ' ms';
      document.getElementById('p50Hedged').textContent = hedgedLatencies[p50Idx].toFixed(1) + ' ms';
      document.getElementById('p99Hedged').textContent = hedgedLatencies[p99Idx].toFixed(1) + ' ms';
      document.getElementById('overhead').textContent = ((extraRequests / calls) * 100).toFixed(1) + '% extra API calls';
    }
  </script>
</body>
</html>
